<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="작은 호기심으로 새로운 플레이를 만드는 독립 게임 스튜디오, Studio Nebbiolo.">
  <title>Studio Nebbiolo — 호기심을 플레이하다</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=minimal-3">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="header">
    <a class="wordmark" href="#home" aria-label="Studio Nebbiolo 홈"><span class="logo-symbol" aria-hidden="true"></span>nebbiolo</a>
    <nav aria-label="주 메뉴"><a href="#home" class="active">홈</a><a href="#games">게임들</a><a href="#about">소개</a></nav>
    <button class="theme-toggle" aria-label="어두운 테마로 전환" aria-pressed="false"><span class="theme-icon" aria-hidden="true"></span></button>
  </header>
  <main>
    <section id="home" class="hero section">
      <div class="hero-layout">
        <h1>호기심을<br><span class="outlined">플레이</span>하다<span class="heading-period">.</span></h1>
        <div class="playground-wrap">
          <div class="playground" aria-label="움직이는 도형 놀이터">
            <div class="grid-lines" aria-hidden="true"></div>
            <button class="toy toy-star" aria-label="별 도형 움직이기" data-x="0.58" data-y="0.27"><svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 0 117 58 171 29 142 83 200 100 142 117 171 171 117 142 100 200 83 142 29 171 58 117 0 100 58 83 29 29 83 58Z"/></svg></button>
<button class="toy toy-ring" aria-label="고리 도형 움직이기" data-x="0.26" data-y="0.48"><span aria-hidden="true"></span></button>
<button class="toy toy-block" aria-label="사각형 도형 움직이기" data-x="0.63" data-y="0.67"><span aria-hidden="true"></span></button>
<button class="toy toy-ball" aria-label="공 도형 움직이기" data-x="0.22" data-y="0.78"><span aria-hidden="true"></span></button>
            <button class="shuffle" aria-label="도형 다시 섞기"><span aria-hidden="true">⤮</span></button>
          </div>
          <span class="sr-only" id="playground-status" role="status"></span>
        </div>
      </div>
      <a class="section-arrow" href="#games" aria-label="게임들로 이동">↓</a>
    </section>
    <section id="games" class="games section">
      <h2>게임들<span class="heading-period">.</span></h2>
      <div class="game-grid"><article class="game-card"><button class="placeholder slot-one" aria-label="1번째 게임 자리 펼치기" aria-expanded="false"><span class="card-art ring-art" aria-hidden="true"></span><span class="card-reveal">준비 중</span></button></article>
<article class="game-card"><button class="placeholder slot-two" aria-label="2번째 게임 자리 펼치기" aria-expanded="false"><span class="card-art star-art" aria-hidden="true"><svg viewBox="0 0 200 200"><path d="M100 0 117 58 171 29 142 83 200 100 142 117 171 171 117 142 100 200 83 142 29 171 58 117 0 100 58 83 29 29 83 58Z"/></svg></span><span class="card-reveal">준비 중</span></button></article>
<article class="game-card"><button class="placeholder slot-three" aria-label="3번째 게임 자리 펼치기" aria-expanded="false"><span class="card-art steps-art" aria-hidden="true"><i></i><i></i><i></i></span><span class="card-reveal">준비 중</span></button></article>
<article class="game-card"><button class="placeholder slot-four" aria-label="4번째 게임 자리 펼치기" aria-expanded="false"><span class="card-art dots-art" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="card-reveal">준비 중</span></button></article></div>
    </section>
    <section id="about" class="about section">
      <h2>소개<span class="heading-period">.</span></h2>
      <div class="about-layout">
        <p>작은 스튜디오.<br>상상에는<br><span>크기 제한 없이.</span></p>
        <div class="about-orbit" aria-hidden="true"><i></i></div>
      </div>
      <a href="#home" class="back-top" aria-label="처음으로">↑</a>
    </section>
  </main>
  <script src="assets/js/main.js?v=minimal-3"></script>
</body>
</html>
