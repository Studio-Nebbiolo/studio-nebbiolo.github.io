<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="작은 호기심으로 새로운 플레이를 만드는 독립 프로덕트 스튜디오, Studio Nebbiolo.">
  <title>Studio Nebbiolo — 호기심을 플레이하다</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=products-4">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="header">
    <a class="wordmark" href="#home" aria-label="Studio Nebbiolo 홈"><span class="logo-symbol" aria-hidden="true"></span>nebbiolo</a>
    <nav aria-label="주 메뉴"><a href="#home" class="active">홈</a><a href="#products">프로덕트들</a><a href="#about">소개</a></nav>
    <button class="theme-toggle" aria-label="어두운 테마로 전환" aria-pressed="false"><span class="theme-icon" aria-hidden="true"></span></button>
  </header>
  <main>
    <section id="home" class="hero section">
      <div class="hero-layout">
        <h1>호기심을<br><span class="outlined">플레이</span>하다<span class="heading-period">.</span></h1>
        <div class="playground-wrap">
          <div class="playground" aria-label="움직이는 도형 놀이터">
            <div class="grid-lines" aria-hidden="true"></div>
            <button class="toy toy-star" aria-label="별 도형 움직이기" data-x="0.58" data-y="0.27"><svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 0 117 58 171 29 142 83 200 100 142 117 171 171 117 142 100 200 83 142 29 171 58 117 0 100 58 83 29 29 83 58Z"/></svg></button>
<button class="toy toy-ring" aria-label="고리 도형 움직이기" data-x="0.26" data-y="0.48"><span aria-hidden="true"></span></button>
<button class="toy toy-block" aria-label="사각형 도형 움직이기" data-x="0.63" data-y="0.67"><span aria-hidden="true"></span></button>
<button class="toy toy-ball" aria-label="공 도형 움직이기" data-x="0.22" data-y="0.78"><span aria-hidden="true"></span></button>
            <button class="shuffle" aria-label="도형 다시 섞기"><span aria-hidden="true">⤮</span></button>
          </div>
          <span class="sr-only" id="playground-status" role="status"></span>
        </div>
      </div>
      <a class="section-arrow" href="#products" aria-label="프로덕트들로 이동">↓</a>
    </section>
    <section id="products" class="products section">
      <h2>프로덕트들<span class="heading-period">.</span></h2>
      <div class="product-grid">
        <article class="product-card product-bbokgong">
          <button class="product-open" data-product="bbokgong" aria-label="뽁뽁이공장 자세히 보기" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img src="assets/img/products/bbokgong-preview.png" alt="입체적인 뽁뽁이 시트" loading="lazy" decoding="async"></span>
            <span class="product-caption"><span class="product-name">뽁뽁이공장</span><span class="product-arrow" aria-hidden="true">↗</span></span>
          </button>
        </article>
        <article class="product-card product-murim">
          <button class="product-open" data-product="murim" aria-label="무림 문파 감별록 자세히 보기" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img src="assets/img/products/murim-landscape.jpg" alt="무림 문파 감별록의 화산파 산수 풍경" loading="lazy" decoding="async"></span>
            <span class="product-caption"><span class="product-name">무림 문파 감별록</span><span class="product-arrow" aria-hidden="true">↗</span></span>
          </button>
        </article>
        <article class="product-card product-strike">
          <button class="product-open" data-product="strike" aria-label="스트라이크 스트라이크 2 자세히 보기" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img src="assets/img/products/strike-kingpin.png" alt="스트라이크 스트라이크 2의 킹핀 보스" loading="lazy" decoding="async"></span>
            <span class="product-caption"><span class="product-name">스트라이크 스트라이크 2</span><span class="product-arrow" aria-hidden="true">↗</span></span>
          </button>
        </article>
        <article class="product-card product-bigwalk">
          <button class="product-open" data-product="bigwalk" aria-label="빅 워크 데스크탑 펫 자세히 보기" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img src="assets/img/products/big-walk-friends.png" alt="작업표시줄 위를 걷는 빅 워크 친구들" loading="lazy" decoding="async"></span>
            <span class="product-caption"><span class="product-name">빅 워크 데스크탑 펫</span><span class="product-arrow" aria-hidden="true">↗</span></span>
          </button>
        </article>
        <article class="product-card product-farm">
          <button class="product-open" data-product="farm" aria-label="방치형 농장 키우기 자세히 보기" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img src="assets/img/products/farm-preview.png" alt="방치형 농장 키우기의 픽셀 아트 농장" loading="lazy" decoding="async"></span>
            <span class="product-caption"><span class="product-name">방치형 농장 키우기</span><span class="product-arrow" aria-hidden="true">↗</span></span>
          </button>
        </article>
      </div>
    </section>
    <section id="about" class="about section">
      <h2>소개<span class="heading-period">.</span></h2>
      <div class="about-layout">
        <p>작은 스튜디오.<br>상상에는<br><span>크기 제한 없이.</span></p>
        <div class="about-orbit" aria-hidden="true"><i></i></div>
      </div>
      <a href="#home" class="back-top" aria-label="처음으로">↑</a>
    </section>
  </main>
  <dialog id="product-dialog" aria-labelledby="product-title" aria-describedby="product-description">
    <button class="dialog-close" aria-label="닫기" autofocus><span aria-hidden="true">×</span></button>
    <div class="dialog-content"></div>
  </dialog>
  <template id="product-bbokgong">
    <div class="dialog-visual product-bbokgong"><img src="assets/img/products/bbokgong-preview.png" alt="입체적인 뽁뽁이 시트" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title">뽁뽁이공장</h2>
      <p id="product-description">누르고, 당기고, 톡. 손끝으로 뽁뽁이를 터뜨리며 잠깐 쉬어가는 작은 놀이터입니다.</p>

      <div class="product-actions"><a class="product-action" href="https://studio-nebbiolo.github.io/Bbokgong/" target="_blank" rel="noopener noreferrer">열기 ↗</a><a class="source-link" href="https://github.com/Studio-Nebbiolo/Bbokgong" target="_blank" rel="noopener noreferrer" aria-label="뽁뽁이공장 GitHub 리포지토리">GitHub ↗</a></div>
    </div>
  </template>
  <template id="product-murim">
    <div class="dialog-visual product-murim"><img src="assets/img/products/murim-landscape.jpg" alt="무림 문파 감별록의 화산파 산수 풍경" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title">무림 문파 감별록</h2>
      <p id="product-description">당신이 강호에 산다면, 어느 문파일까요? 질문에 답하고 29개 문파 중 나와 닮은 곳을 찾아보세요.</p>

      <div class="product-actions"><a class="product-action" href="https://studio-nebbiolo.github.io/MyMurim/" target="_blank" rel="noopener noreferrer">감별하기 ↗</a><a class="source-link" href="https://github.com/Studio-Nebbiolo/MyMurim" target="_blank" rel="noopener noreferrer" aria-label="무림 문파 감별록 GitHub 리포지토리">GitHub ↗</a></div>
    </div>
  </template>
  <template id="product-strike">
    <div class="dialog-visual product-strike"><img src="assets/img/products/strike-kingpin.png" alt="스트라이크 스트라이크 2의 킹핀 보스" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title">스트라이크 스트라이크 2</h2>
      <p id="product-description">볼링핀이 되고, 볼링공으로 맞섭니다. 공을 굴리고 튕겨 상대를 넘어뜨리는 팀 전투와 보스 원정을 만나보세요.</p>
      <p class="product-note">ZIP 파일을 모두 풀고 실행하세요. Windows용 개발 프리릴리스입니다.</p>
      <div class="product-actions"><a class="product-action" href="https://github.com/Studio-Nebbiolo/Strike-Strike-2-Build/releases" target="_blank" rel="noopener noreferrer">Windows 다운로드 ↗</a><a class="source-link" href="https://github.com/Studio-Nebbiolo/Strike-Strike" target="_blank" rel="noopener noreferrer" aria-label="스트라이크 스트라이크 2 GitHub 리포지토리">GitHub ↗</a></div>
    </div>
  </template>
  <template id="product-bigwalk">
    <div class="dialog-visual product-bigwalk"><img src="assets/img/products/big-walk-friends.png" alt="작업표시줄 위를 걷는 빅 워크 친구들" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title">빅 워크 데스크탑 펫</h2>
      <p id="product-description">걷고, 졸고, 손을 흔드는 작은 데스크톱 친구들. 클릭하고 끌어보세요. Big Walk에서 영감을 받은 비공식 팬 프로젝트입니다.</p>

      <div class="product-actions"><a class="product-action" href="https://github.com/Studio-Nebbiolo/Big-Walk-Desktop-Companion/releases/latest" target="_blank" rel="noopener noreferrer">Windows 다운로드 ↗</a><a class="source-link" href="https://github.com/Studio-Nebbiolo/Big-Walk-Desktop-Companion" target="_blank" rel="noopener noreferrer" aria-label="빅 워크 데스크탑 펫 GitHub 리포지토리">GitHub ↗</a></div>
    </div>
  </template>
  <template id="product-farm">
    <div class="dialog-visual product-farm"><img src="assets/img/products/farm-preview.png" alt="방치형 농장 키우기의 픽셀 아트 농장" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title">방치형 농장 키우기</h2>
      <p id="product-description">씨앗을 심고, 물을 주고, 잠시 다른 일을 하세요. 자리를 비운 동안에도 작물이 자라는 나만의 작은 농장입니다.</p>

      <div class="product-actions"><a class="product-action" href="play/farm-idler/index.html" target="_blank" rel="noopener noreferrer">열기 ↗</a><a class="product-action secondary" href="https://github.com/Studio-Nebbiolo/Farm-Idler-Build" target="_blank" rel="noopener noreferrer">Windows 빌드 ↗</a><a class="source-link" href="https://github.com/Studio-Nebbiolo/Farm-Idler" target="_blank" rel="noopener noreferrer" aria-label="방치형 농장 키우기 GitHub 리포지토리">GitHub ↗</a></div>
    </div>
  </template>
  <script src="assets/js/main.js?v=products-4"></script>
  <script src="assets/js/products.js?v=products-4"></script>
</body>
</html>
