<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="작은 호기심으로 새로운 플레이를 만드는 독립 프로덕트 스튜디오, Studio Nebbiolo.">
  <title>Nebbiolo</title>
  <link rel="icon" href="assets/img/favicon.svg?v=brand-6" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=pinwheel-9">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="header">
    <a class="wordmark" href="#products" aria-label="Nebbiolo 만든 것들" data-i18n-aria="homeLink"><span class="logo-symbol" aria-hidden="true"></span>nebbiolo</a>
    <nav aria-label="주 메뉴" data-i18n-aria="navigation"><a href="#products" class="active" data-i18n="made">만든 것들</a><a href="#about" data-i18n="about">소개</a></nav>
    <div class="header-controls"><button class="language-toggle" type="button" aria-label="Switch to English" lang="en">EN</button>
    <button class="theme-toggle" aria-label="어두운 테마로 전환" aria-pressed="false"><span class="theme-icon" aria-hidden="true"></span></button></div>
  </header>
  <main>
    <section id="products" class="products section">
      <div class="collection-heading">
        <h1><span data-i18n="made">만든 것들</span><span class="heading-period">.</span></h1>
        <div class="collection-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <div class="product-grid">
        <article class="product-card product-bbokgong">
          <button class="product-open" data-product="bbokgong" aria-label="뽁뽁이 공장 자세히 보기" data-i18n-aria="bbokgongOpen" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img draggable="false" src="assets/img/products/bbokgong-preview.png" alt="입체적인 뽁뽁이 시트" data-i18n-alt="bbokgongImage" loading="eager" decoding="async"></span>
            <span class="product-caption"><span class="product-name" data-i18n="bbokgongName">뽁뽁이 공장</span><span class="product-arrow" aria-hidden="true"><svg class="link-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          </button>
        </article>
        <article class="product-card product-murim">
          <button class="product-open" data-product="murim" aria-label="무림 문파 감별록 자세히 보기" data-i18n-aria="murimOpen" aria-haspopup="dialog" aria-controls="product-dialog">
            <span class="product-visual"><img draggable="false" src="assets/img/products/murim-landscape.jpg" alt="무림 문파 감별록의 화산파 산수 풍경" data-i18n-alt="murimImage" loading="eager" decoding="async"></span>
            <span class="product-caption"><span class="product-name" data-i18n="murimName">무림 문파 감별록</span><span class="product-arrow" aria-hidden="true"><svg class="link-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          </button>
        </article>
      </div>
    </section>
    <section id="about" class="about section">
      <h2><span data-i18n="about">소개</span><span class="heading-period">.</span></h2>
      <div class="about-layout">
        <p class="about-statement"><span data-i18n="aboutFirst">세상에</span><br><button class="about-emphasis about-word" data-i18n="aboutMiddle" aria-label="바람개비 돌리기" data-i18n-aria="spinPinwheel">행복을</button><br><span data-i18n="aboutLast">뿌리기 위해.</span></p>
        <div class="pinwheel-scene">
          <button class="pinwheel-play" aria-label="바람개비 돌리기" data-i18n-aria="spinPinwheel">
            <span class="pinwheel-stick" aria-hidden="true"></span>
            <svg class="pinwheel-rotor" viewBox="0 0 300 300" aria-hidden="true">
              <g class="blade-plum"><path d="M150 150V20Q236 20 258 106Z"/><path class="blade-fold" d="m150 150 52-74 56 30Z"/></g>
              <g class="blade-blue" transform="rotate(90 150 150)"><path d="M150 150V20Q236 20 258 106Z"/><path class="blade-fold" d="m150 150 52-74 56 30Z"/></g>
              <g class="blade-clay" transform="rotate(180 150 150)"><path d="M150 150V20Q236 20 258 106Z"/><path class="blade-fold" d="m150 150 52-74 56 30Z"/></g>
              <g class="blade-plum" transform="rotate(270 150 150)"><path d="M150 150V20Q236 20 258 106Z"/><path class="blade-fold" d="m150 150 52-74 56 30Z"/></g>
              <circle class="pinwheel-hub" cx="150" cy="150" r="12"/>
              <circle class="pinwheel-pin" cx="150" cy="150" r="4"/>
            </svg>
          </button>
          <span class="sr-only pinwheel-status" role="status"></span>
        </div>
      </div>
      <a href="#products" class="back-top" aria-label="처음으로" data-i18n-aria="backTop">↑</a>
    </section>
  </main>
  <dialog id="product-dialog" aria-labelledby="product-title" aria-describedby="product-description">
    <button class="dialog-close" aria-label="닫기" data-i18n-aria="close" autofocus><span aria-hidden="true">×</span></button>
    <div class="dialog-content"></div>
  </dialog>
  <template id="product-bbokgong">
    <div class="dialog-visual product-bbokgong"><img draggable="false" src="assets/img/products/bbokgong-preview.png" alt="입체적인 뽁뽁이 시트" data-i18n-alt="bbokgongImage" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title" data-i18n="bbokgongName">뽁뽁이 공장</h2>
      <p id="product-description" data-i18n="bbokgongDescription">손끝으로 뽁뽁이를 터뜨리며 잠깐 쉬어가는 작은 놀이터.</p>

      <div class="product-actions"><a class="product-action" href="https://studio-nebbiolo.github.io/Bbokgong/" target="_blank" rel="noopener noreferrer" ><span data-i18n="openAction">열기</span><svg class="link-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
    </div>
  </template>
  <template id="product-murim">
    <div class="dialog-visual product-murim"><img draggable="false" src="assets/img/products/murim-landscape.jpg" alt="무림 문파 감별록의 화산파 산수 풍경" data-i18n-alt="murimImage" decoding="async"></div>
    <div class="dialog-copy">
      <h2 id="product-title" data-i18n="murimName">무림 문파 감별록</h2>
      <p id="product-description" data-i18n="murimDescription">당신이 강호에 산다면, 어느 문파일까요? 질문에 답하고 29개 문파 중 나와 닮은 곳을 찾아보세요.</p>

      <div class="product-actions"><a class="product-action" href="https://studio-nebbiolo.github.io/MyMurim/" target="_blank" rel="noopener noreferrer" ><span data-i18n="murimAction">감별하기</span><svg class="link-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
    </div>
  </template>
  <script src="assets/js/i18n.js?v=pinwheel-9"></script>
  <script src="assets/js/main.js?v=pinwheel-9"></script>
  <script src="assets/js/products.js?v=pinwheel-9"></script>
  <script src="assets/js/about.js?v=pinwheel-9"></script>
</body>
</html>
